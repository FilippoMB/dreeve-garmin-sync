[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dreeve-garmin-sync"
version = "0.1.0"
description = "Synchronize original Garmin Connect activities into Dreeve's file inbox"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["garminconnect==0.3.20"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "uv==0.13.6",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[project.urls]
Documentation = "https://github.com/FilippoMB/dreeve-garmin-sync#readme"
Issues = "https://github.com/FilippoMB/dreeve-garmin-sync/issues"
Repository = "https://github.com/FilippoMB/dreeve-garmin-sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "garminconnect"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the established rule set stable across Ruff upgrades.
select = ["E4", "E7", "E9", "F"]
