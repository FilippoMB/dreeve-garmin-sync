name: Bug report
description: Report a reproducible connector problem without sharing private activity data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Garmin tokens and activity files contain sensitive account and location data. Do not attach `.env`, token JSON, FIT/TCX/GPX files, databases, archives, or unredacted logs.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, email addresses, activity IDs, filenames, coordinates, routes, and other personal data from this report.
          required: true

  - type: input
    id: version
    attributes:
      label: Connector version or image digest
      placeholder: 0.1.0 or ghcr.io/...@sha256:...
    validations:
      required: true

  - type: input
    id: dreeve-version
    attributes:
      label: Dreeve version
      placeholder: 5.0.2
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Host architecture
      options:
        - Linux AMD64
        - Linux ARM64
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence using redacted values.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the minimum relevant lines after applying the privacy checklist above.
      render: text

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I am using Dreeve file-import mode and its daemon is running.
          required: true
